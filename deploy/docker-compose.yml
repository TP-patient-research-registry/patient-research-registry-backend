# Production stack for a single Ubuntu server. See deploy/README.md.
# Only nginx publishes ports; Postgres and Redis sit on an internal network without internet access.
name: registry

x-backend: &backend
  image: ${BACKEND_IMAGE:?set BACKEND_IMAGE in .env}
  env_file: .env
  restart: unless-stopped
  networks: [app, data]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      NGINX_ENVSUBST_FILTER: "^DOMAIN$"
    volumes:
      # Rendered by the image's envsubst into /etc/nginx/conf.d/default.conf (only ${DOMAIN} is replaced).
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - static:/var/www/static:ro
    networks: [app]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE in .env}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/sk"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    <<: *backend
    environment:
      DJANGO_MIGRATE: "1"
      DJANGO_COLLECTSTATIC: "1"
    volumes:
      - static:/app/staticfiles
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/health/', headers={'Host': 'backend'}), timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery-worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy  # migrations have run
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery-beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-registry}
      POSTGRES_USER: ${POSTGRES_USER:-registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app: {}
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  static:

[project]
name = "patient-research-registry-backend"
version = "0.1.0"
description = "Backend API for the Patient Research Registry (Slovakia)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "celery[redis]>=5.6.3",
    "django>=5.2,<6",
    "django-allauth[mfa]>=65.19.7",
    "django-auditlog>=3.4.1",
    "django-cors-headers>=4.9.0",
    "django-cryptography-5>=2.0.3",
    "django-environ>=0.14.0",
    "django-guardian>=3.5.0",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=40.40.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --reuse-db"
filterwarnings = ["ignore::DeprecationWarning:django_cryptography.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF"]
ignore = ["RUF012"]  # mutable class attrs are idiomatic in Django/DRF (permission_classes, Meta.fields)

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S101"]
"config/settings/*" = ["F405"]
"apps/core/management/commands/seed_demo.py" = ["S311"]  # fake demo data, not security-relevant

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
